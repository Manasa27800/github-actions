<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS DevOps Deployment</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            max-width: 700px;
            width: 90%;
            padding: 50px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .highlight {
            color: #2563eb;
        }

        p {
            font-size: 18px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .status {
            display: inline-block;
            padding: 10px 18px;
            background: #dcfce7;
            color: #166534;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        footer {
            font-size: 14px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="status">● Deployment Successful</div>

        <h1>AWS <span class="highlight">DevOps</span> Project</h1>

        <p>
            This website is deployed on an AWS EC2 instance
            using Nginx and automated through GitHub Actions.
        </p>

        <footer>
            CI/CD • AWS EC2 • Nginx • GitHub Actions
        </footer>
    </div>

</body>
</html>
